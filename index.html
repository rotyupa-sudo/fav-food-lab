
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เมนูอาหาร</title>
</head>
<body>
    <h1>เมนูอาหารของฉัน</h1>
    <ul id="menu"></ul>

    <script>
        fetch('./Menu.text')
            .then(response => {
                if (!response.ok) throw new Error('ไม่พบไฟล์ Menu.text');
                return response.text();
            })
            .then(data => {
                const menu = document.getElementById('menu');

                data.split(/\r?\n/).forEach(line => {
                    if (line.trim()) {
                        const li = document.createElement('li');
                        li.textContent = line;
                        menu.appendChild(li);
                    }
                });
            })
            .catch(error => {
                document.getElementById('menu').textContent = error.message;
            });
    </script>
</body>
</html>
